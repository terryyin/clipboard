name: Native Windows copy-files

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-windows-copy-files:
    name: Native Windows copy_files CF_HDROP + Explorer paste (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.11.21'
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --locked
      - name: Gated Windows copy_files probe (fails when it cannot verify)
        env:
          CLIPBOARD_NATIVE_PROBE: '1'
        run: uv run --locked pytest tests/test_copy_files_native_windows.py -v -rP
