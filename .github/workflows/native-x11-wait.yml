name: Native X11 wait

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-linux-x11-wait:
    name: Native Linux X11 wait (Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.21'
          python-version: '3.13'
          enable-cache: true
      - name: Install X11 clipboard helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y xclip xvfb
      - run: uv sync --locked
      - name: Gated X11 wait probe under Xvfb
        env:
          CLIPBOARD_NATIVE_PROBE: '1'
        run: >
          xvfb-run -a
          uv run --locked
          pytest tests/test_wait_native_linux_x11.py -v -rP
