name: Native Windows wait

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-windows-wait:
    name: Native Windows wait (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.21'
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --locked
      - name: Gated Windows wait probe (fails on an evidence limit)
        env:
          CLIPBOARD_NATIVE_PROBE: '1'
        run: uv run --locked pytest tests/test_wait_native_windows.py -v -rP

  # Attempt summary for Intent → CI status. Skipped on the release workflow_call.
