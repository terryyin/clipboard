name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Validate this release tag before building
        type: string
        default: ''
    outputs:
      distributions-artifact-id:
        description: Immutable artifact containing the checked wheel and sdist
        value: ${{ jobs.quality.outputs.artifact-id }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and package (Nix)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Check the Nix environment
        run: nix flake check --no-update-lock-file
      - name: Validate release tag against package metadata
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: nix develop --no-update-lock-file -c uv run --locked python scripts/check_release.py "$RELEASE_TAG"
      - name: Lint, test, and build
        run: nix develop --no-update-lock-file -c make check lint-workflows test-package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: distributions-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error

  tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.21'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra images
      - run: uv run --locked --extra images pytest

  native-linux-x11-copy-image:
    name: Native Linux X11 copy_image (Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.21'
          python-version: '3.13'
          enable-cache: true
      - name: Install X11 clipboard helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y xclip xvfb
      - run: uv sync --locked --extra images
      - name: Gated X11 copy_image probe under Xvfb
        env:
          CLIPBOARD_NATIVE_PROBE: '1'
        run: >
          xvfb-run -a
          uv run --locked --extra images
          pytest tests/test_copy_image_native_linux_x11.py -v

  native-linux-x11-paste-html:
    name: Native Linux X11 paste_html (Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.21'
          python-version: '3.13'
          enable-cache: true
      - name: Install X11 clipboard helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y xclip xvfb
      - run: uv sync --locked
      - name: Gated X11 paste_html probe under Xvfb
        env:
          CLIPBOARD_NATIVE_PROBE: '1'
        run: >
          xvfb-run -a
          uv run --locked
          pytest tests/test_paste_html_native_linux_x11.py -v

  native-linux-x11-text:
    name: Native Linux X11 text copy/paste (Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.21'
          python-version: '3.13'
          enable-cache: true
      - name: Install X11 clipboard helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y xclip xvfb
      - run: uv sync --locked
      - name: Gated X11 text probe under Xvfb
        env:
          CLIPBOARD_NATIVE_PROBE: '1'
        run: >
          xvfb-run -a
          uv run --locked
          pytest tests/test_text_native_linux_x11.py -v -rP

  native-linux-x11-file-manager-offers:
    name: Native Linux file-manager offers (Thunar/Xvfb)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.21'
          python-version: '3.13'
          enable-cache: true
      - name: Install isolated X11 file-manager environment
        run: |
          sudo apt-get update
          sudo apt-get install -y thunar xclip xdotool xvfb xauth dbus-x11 openbox
      - run: uv sync --locked
      - name: Paste each helper-owned file offer with Thunar
        env:
          CLIPBOARD_NATIVE_PROBE: '1'
          CLIPBOARD_FILE_MANAGER_ISOLATED: '1'
          CLIPBOARD_PROBE_ARTIFACTS: artifacts/file-manager-offers
          GDK_BACKEND: x11
        run: |
          mkdir -p "$CLIPBOARD_PROBE_ARTIFACTS"
          # Variables in the nested shell and trap expand in that session.
          # shellcheck disable=SC2016
          dbus-run-session -- xvfb-run -a sh -eu -c '
            openbox >"$CLIPBOARD_PROBE_ARTIFACTS/openbox.log" 2>&1 &
            openbox_pid=$!
            trap '\''kill "$openbox_pid" 2>/dev/null || true'\'' EXIT
            uv run --locked pytest tests/test_file_manager_offers_native_linux_x11.py -v -rP
          '
      - name: Retain file-manager interoperability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: file-manager-offers-${{ github.run_attempt }}
          path: artifacts/file-manager-offers/
          if-no-files-found: error

  native-linux-wayland-copy-image:
    name: Native Linux Wayland copy_image (Sway)
    uses: ./.github/workflows/native-wayland-copy-image.yml

  native-linux-wayland-paste-html:
    name: Native Linux Wayland paste_html (Sway)
    uses: ./.github/workflows/native-wayland-paste-html.yml

  native-windows-paste-html:
    name: Native Windows paste_html (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.21'
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --locked
      - name: Gated Windows paste_html probe (skips on an evidence limit)
        env:
          CLIPBOARD_NATIVE_PROBE: '1'
        run: uv run --locked pytest tests/test_paste_html_native_windows.py -v -rsP

  ci-passed:
    name: CI passed
    if: always()
    needs:
      - quality
      - tests
      - native-linux-x11-copy-image
      - native-linux-x11-paste-html
      - native-linux-x11-text
      - native-linux-x11-file-manager-offers
      - native-linux-wayland-copy-image
      - native-linux-wayland-paste-html
      - native-windows-paste-html
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          NATIVE_X11_RESULT: ${{ needs.native-linux-x11-copy-image.result }}
          NATIVE_X11_PASTE_HTML_RESULT: ${{ needs.native-linux-x11-paste-html.result }}
          NATIVE_X11_TEXT_RESULT: ${{ needs.native-linux-x11-text.result }}
          NATIVE_FILE_MANAGER_OFFERS_RESULT: ${{ needs.native-linux-x11-file-manager-offers.result }}
          NATIVE_WAYLAND_RESULT: ${{ needs.native-linux-wayland-copy-image.result }}
          NATIVE_WAYLAND_PASTE_HTML_RESULT: ${{ needs.native-linux-wayland-paste-html.result }}
          NATIVE_WINDOWS_PASTE_HTML_RESULT: ${{ needs.native-windows-paste-html.result }}
        run: >-
          test "$QUALITY_RESULT" = success
          && test "$TEST_RESULT" = success
          && test "$NATIVE_X11_RESULT" = success
          && test "$NATIVE_X11_PASTE_HTML_RESULT" = success
          && test "$NATIVE_X11_TEXT_RESULT" = success
          && test "$NATIVE_FILE_MANAGER_OFFERS_RESULT" = success
          && test "$NATIVE_WAYLAND_RESULT" = success
          && test "$NATIVE_WAYLAND_PASTE_HTML_RESULT" = success
          && test "$NATIVE_WINDOWS_PASTE_HTML_RESULT" = success
