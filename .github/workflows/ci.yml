name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Validate this release tag before building
        type: string
        default: ''
    outputs:
      distributions-artifact-id:
        description: Immutable artifact containing the checked wheel and sdist
        value: ${{ jobs.quality.outputs.artifact-id }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_PROOF_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  quality:
    name: Lint and package (Nix)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Check the Nix environment
        run: nix flake check --no-update-lock-file
      - name: Validate release tag against package metadata
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: nix develop --no-update-lock-file -c uv run --locked python scripts/check_release.py "$RELEASE_TAG"
      - name: Lint, test, and build
        run: nix develop --no-update-lock-file -c make check lint-workflows test-package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: distributions-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error

  tests:
    name: Desktop-free tests
    uses: ./.github/workflows/desktop-free-tests.yml
    with:
      release-tag: ${{ inputs.release-tag }}
      revision: ${{ github.event.pull_request.head.sha || github.sha }}

  native-linux-x11-copy-image:
    name: Native Linux X11 copy_image (Xvfb)
    uses: ./.github/workflows/native-x11-copy-image.yml

  native-linux-x11-clear:
    name: Native Linux X11 clear (Xvfb)
    uses: ./.github/workflows/native-x11-clear.yml

  native-linux-x11-paste-html:
    name: Native Linux X11 paste_html (Xvfb)
    uses: ./.github/workflows/native-x11-paste-html.yml

  native-linux-x11-text:
    name: Native Linux X11 text copy/paste (Xvfb)
    uses: ./.github/workflows/native-x11-text.yml

  native-linux-x11-wait:
    name: Native Linux X11 wait (Xvfb)
    uses: ./.github/workflows/native-x11-wait.yml

  native-linux-x11-file-manager-offers:
    name: Native Linux file-manager offers (Thunar/Xvfb)
    uses: ./.github/workflows/native-x11-file-manager-offers.yml

  native-linux-x11-copy-files:
    name: Native Linux X11 copy_files (xclip + Thunar/Xvfb)
    uses: ./.github/workflows/native-x11-copy-files.yml

  native-linux-wayland-copy-image:
    name: Native Linux Wayland copy_image (Sway)
    uses: ./.github/workflows/native-wayland-copy-image.yml

  native-linux-wayland-paste-html:
    name: Native Linux Wayland paste_html (Sway)
    uses: ./.github/workflows/native-wayland-paste-html.yml

  native-linux-wayland-text:
    name: Native Linux Wayland text copy/paste (Sway)
    uses: ./.github/workflows/native-wayland-text.yml

  native-linux-wayland-copy-files:
    name: Native Linux Wayland copy_files (wl-copy on Sway)
    uses: ./.github/workflows/native-wayland-copy-files.yml

  native-linux-wayland-clear:
    name: Native Linux Wayland clear (Sway)
    uses: ./.github/workflows/native-wayland-clear.yml

  native-linux-wayland-wait:
    name: Native Linux Wayland wait (Sway)
    uses: ./.github/workflows/native-wayland-wait.yml

  native-windows-paste-html:
    name: Native Windows paste_html (windows-latest)
    uses: ./.github/workflows/native-windows-paste-html.yml

  native-windows-text:
    name: Native Windows text copy/paste (windows-latest)
    uses: ./.github/workflows/native-windows-text.yml

  native-windows-copy-files:
    name: Native Windows copy_files CF_HDROP + Explorer paste (windows-latest)
    uses: ./.github/workflows/native-windows-copy-files.yml

  native-windows-clear:
    name: Native Windows clear (windows-latest)
    uses: ./.github/workflows/native-windows-clear.yml

  native-windows-wait:
    name: Native Windows wait (windows-latest)
    uses: ./.github/workflows/native-windows-wait.yml

  # Attempt summary for Intent → CI status. Skipped on the release workflow_call.
  ci-proof:
    needs: [tests]
    if: ${{ !cancelled() && inputs.release-tag == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.19'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-proof-fragments-*-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-proof-fragments
      - name: Summarize CI proof
        run: |
          mkdir -p -- "${RUNNER_TEMP}/ci-proof-fragments"
          node scripts/ci-proof-summary.mjs summarize \
            --fragments "${RUNNER_TEMP}/ci-proof-fragments" \
            --expect tests=1 \
            --repository "${GITHUB_REPOSITORY}" --run-id "${GITHUB_RUN_ID}" \
            --attempt "${GITHUB_RUN_ATTEMPT}" --revision "${CI_PROOF_REVISION}" \
            --out "${RUNNER_TEMP}/ci-proof-summary.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-proof-summary-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-proof-summary.json
          if-no-files-found: error
          retention-days: 30

  ci-passed:
    name: CI passed
    if: always()
    needs:
      - quality
      - tests
      - ci-proof
      - native-linux-x11-copy-image
      - native-linux-x11-paste-html
      - native-linux-x11-text
      - native-linux-x11-file-manager-offers
      - native-linux-x11-copy-files
      - native-linux-x11-clear
      - native-linux-x11-wait
      - native-linux-wayland-copy-image
      - native-linux-wayland-paste-html
      - native-linux-wayland-text
      - native-linux-wayland-copy-files
      - native-linux-wayland-clear
      - native-linux-wayland-wait
      - native-windows-paste-html
      - native-windows-text
      - native-windows-copy-files
      - native-windows-clear
      - native-windows-wait
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          CI_PROOF_RESULT: ${{ needs.ci-proof.result }}
          NATIVE_X11_RESULT: ${{ needs.native-linux-x11-copy-image.result }}
          NATIVE_X11_PASTE_HTML_RESULT: ${{ needs.native-linux-x11-paste-html.result }}
          NATIVE_X11_TEXT_RESULT: ${{ needs.native-linux-x11-text.result }}
          NATIVE_FILE_MANAGER_OFFERS_RESULT: ${{ needs.native-linux-x11-file-manager-offers.result }}
          NATIVE_X11_COPY_FILES_RESULT: ${{ needs.native-linux-x11-copy-files.result }}
          NATIVE_X11_CLEAR_RESULT: ${{ needs.native-linux-x11-clear.result }}
          NATIVE_X11_WAIT_RESULT: ${{ needs.native-linux-x11-wait.result }}
          NATIVE_WAYLAND_RESULT: ${{ needs.native-linux-wayland-copy-image.result }}
          NATIVE_WAYLAND_PASTE_HTML_RESULT: ${{ needs.native-linux-wayland-paste-html.result }}
          NATIVE_WAYLAND_TEXT_RESULT: ${{ needs.native-linux-wayland-text.result }}
          NATIVE_WAYLAND_COPY_FILES_RESULT: ${{ needs.native-linux-wayland-copy-files.result }}
          NATIVE_WAYLAND_CLEAR_RESULT: ${{ needs.native-linux-wayland-clear.result }}
          NATIVE_WAYLAND_WAIT_RESULT: ${{ needs.native-linux-wayland-wait.result }}
          NATIVE_WINDOWS_PASTE_HTML_RESULT: ${{ needs.native-windows-paste-html.result }}
          NATIVE_WINDOWS_TEXT_RESULT: ${{ needs.native-windows-text.result }}
          NATIVE_WINDOWS_COPY_FILES_RESULT: ${{ needs.native-windows-copy-files.result }}
          NATIVE_WINDOWS_CLEAR_RESULT: ${{ needs.native-windows-clear.result }}
          NATIVE_WINDOWS_WAIT_RESULT: ${{ needs.native-windows-wait.result }}
        run: >-
          test "$QUALITY_RESULT" = success
          && test "$TEST_RESULT" = success
          && { test "$CI_PROOF_RESULT" = success || test "$CI_PROOF_RESULT" = skipped; }
          && test "$NATIVE_X11_RESULT" = success
          && test "$NATIVE_X11_PASTE_HTML_RESULT" = success
          && test "$NATIVE_X11_TEXT_RESULT" = success
          && test "$NATIVE_FILE_MANAGER_OFFERS_RESULT" = success
          && test "$NATIVE_X11_COPY_FILES_RESULT" = success
          && test "$NATIVE_X11_CLEAR_RESULT" = success
          && test "$NATIVE_X11_WAIT_RESULT" = success
          && test "$NATIVE_WAYLAND_RESULT" = success
          && test "$NATIVE_WAYLAND_PASTE_HTML_RESULT" = success
          && test "$NATIVE_WAYLAND_TEXT_RESULT" = success
          && test "$NATIVE_WAYLAND_COPY_FILES_RESULT" = success
          && test "$NATIVE_WAYLAND_CLEAR_RESULT" = success
          && test "$NATIVE_WAYLAND_WAIT_RESULT" = success
          && test "$NATIVE_WINDOWS_PASTE_HTML_RESULT" = success
          && test "$NATIVE_WINDOWS_TEXT_RESULT" = success
          && test "$NATIVE_WINDOWS_COPY_FILES_RESULT" = success
          && test "$NATIVE_WINDOWS_CLEAR_RESULT" = success
          && test "$NATIVE_WINDOWS_WAIT_RESULT" = success
