[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipboard"
dynamic = ["version"]
description = "A cross-platform clipboard library for text, images, HTML dual offers, and file-list reads."
readme = "README.rst"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Terry Yin", email = "terry@odd-e.com" }]
dependencies = ["pyperclip>=1.8.2,<2"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
images = ["pillow>=10,<12"]

[project.urls]
Homepage = "https://github.com/terryyin/clipboard"
Issues = "https://github.com/terryyin/clipboard/issues"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "pytest>=8.4,<10",
  "ruff>=0.14,<1",
  "setuptools>=77",
  "twine>=7.0.0,<8",
  "wheel>=0.45",
]

[tool.setuptools]
packages = ["clipboard"]

[tool.setuptools.dynamic]
version = { attr = "clipboard.VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py310"
extend-exclude = [".agents", ".claude", ".codex", ".cursor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
